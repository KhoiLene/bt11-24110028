server.port=8080
server.servlet.context-path=/
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ------------------------------------------------------------------------------
# 1. CẤU HÌNH KẾT NỐI CƠ SỞ DỮ LIỆU SQL SERVER (WebDB)
# ------------------------------------------------------------------------------
# Chế độ Windows Authentication (Mặc định)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=WebDB;integratedSecurity=true;trustServerCertificate=true;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

